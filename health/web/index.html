<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Health</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1322'/%3E%3Cpath d='M6 22 L12 14 L17 18 L26 7' stroke='%2322d3ee' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="main"></div>
    <script type="module">
      import init from "./health-ui.js";
      init().catch((e) => {
        console.error(e);
        const el = document.getElementById("main");
        if (el) {
          el.textContent = "failed to start: " + e;
          el.style.cssText =
            "color:#fb7185;font-family:monospace;padding:2rem;";
        }
      });
    </script>
  </body>
</html>
