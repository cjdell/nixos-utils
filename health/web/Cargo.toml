[package]
name = "health-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "=0.3.98", features = [
  "CanvasGradient",
  "CanvasRenderingContext2d",
  "HtmlCanvasElement",
  "Element",
  "Document",
  "Window",
  "DomRect",
  "TextMetrics",
] }

# Pinned to match the wasm-bindgen-cli shipped in nixpkgs (0.2.121): the CLI
# and the crate's schema version must match exactly. Update all four together.
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "=0.4.71"
js-sys = "=0.3.98"

[profile.release]
lto = true
opt-level = "s"
strip = true
